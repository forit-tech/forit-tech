name: Profile analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "analytics/**"
      - ".github/workflows/profile-analytics.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python analytics/generate.py

      - name: Commit updated analytics
        run: |
          if git diff --quiet -- assets/analytics.svg analytics/snapshots/latest.json; then
            echo "No analytics changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics.svg analytics/snapshots/latest.json
          git commit -m "chore(profile): refresh analytics"
          git push
